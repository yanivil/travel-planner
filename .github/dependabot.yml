# D-024: dependency updates arrive as PRs through the normal gate (CI + owner
# merge). Minor/patch bumps are grouped to keep PR noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
